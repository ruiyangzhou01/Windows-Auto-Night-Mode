name: Validate process suggestion filtering
on:
  push:
    branches: [ci/validate-process-filter]
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Build unchanged baseline
        run: dotnet build WindowsAutoDarkMode.slnx -c Debug -p:Platform=x64
      - name: Apply candidate patch in runner workspace
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("candidate.patch", [Convert]::FromBase64String(""))
          git apply --check candidate.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply candidate.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Build candidate
        run: dotnet build WindowsAutoDarkMode.slnx -c Debug -p:Platform=x64 --no-restore
